nt.</p></div><h2>Our TAGLINE</h2><div class="tag">“Navigate LSR with ease”<small>We help students navigate classrooms, open spaces, eateries, libraries, and more around campus with ease, keeping in mind inclusivity and accessibility for students who fall under the PwD category.</small></div><h2>Credits</h2><div class="cr">${cr('Ideation and Coordination','Chandrani')}${cr('Coding, Technical Compilation and Prototype Design','Shreya')}${cr('Map Building and Navigation','Nibedita and Chandrani','Old Building, Peace Centre, ASSK, Psych Terrace')}${cr('Map Building and Navigation','Navya and Aakriti','New Building')}${cr('Map Building and Navigation','Vedika and Chandrani','Open Spaces, Sitting Areas')}${cr('Name and Tagline','Team')}${cr('Logo Design','Aakriti, Navya and Nibedita')}${cr('Photos','Vedika')}</div></div>`}
